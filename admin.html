<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Deon Orina</title>
  <meta name="description" content="Admin." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="author" content="Deon Orina" />
  <meta name="theme-color" content="#0B6B53" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="nav-wrapper" id="nav">
    <nav class="nav" aria-label="Main">
      <a href="/" class="nav-logo" aria-label="Deon Orina, home">deon<span>.</span></a>
      <div class="nav-center">
        <a href="/">Home</a>
        <a href="/services">Services</a>
        <a href="/about">About</a>
        <a href="/quote">Get a quote</a>
        <a href="/pay">Pay</a>
        <a href="/track">Track</a>
      </div>
      <div class="nav-right">
        <a href="/quote" class="btn btn-sm">Start a project</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navDrawer"><span></span><span></span><span></span></button>
    </nav>
  </header>
  <div class="nav-drawer" id="navDrawer">
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/about">About</a>
    <a href="/quote">Get a quote</a>
    <a href="/pay">Pay</a>
    <a href="/track">Track</a>
    <a href="/quote" class="btn">Start a project</a>
  </div>

  <main class="page">
    <div class="wrap">

      <section id="gate" class="admin-gate">
        <div class="page-head"><h1 class="type-statement">Admin.</h1><p class="type-lede muted">Enter your admin key (ADMIN_KEY on Render). It stays in this browser only.</p></div>
        <form class="panel form" id="gateForm" novalidate>
          <div class="field"><label for="a-key">Admin key</label><input id="a-key" type="password" autocomplete="current-password" required /></div>
          <p class="field-hint" id="gateMsg" hidden style="color:var(--red)"></p>
          <button class="btn btn-ink btn-full" type="submit">Open</button>
        </form>
      </section>

      <section id="dash" hidden>
        <div class="admin-bar">
          <h1 class="admin-title">Dashboard</h1>
          <nav class="admin-tabs" role="tablist">
            <button type="button" data-tab="projects" class="on">Projects</button>
            <button type="button" data-tab="quotes">Quotes</button>
            <button type="button" data-tab="invoices">Invoices</button>
            <button type="button" data-tab="payments">Payments</button>
          </nav>
          <div class="admin-bar-right"><a class="btn btn-sm btn-outline" href="/invoice">New invoice</a><button class="btn btn-sm btn-outline" type="button" id="lockBtn">Lock</button></div>
        </div>

        <!-- Projects -->
        <div class="tab" data-pane="projects">
          <div class="admin-grid">
            <form class="panel form" id="newProject" novalidate>
              <div class="panel-title"><h2>New project</h2></div>
              <div class="field"><label for="np-title">Project title</label><input id="np-title" name="title" placeholder="Acme company website" /></div>
              <div class="form-row">
                <div class="field"><label for="np-name">Client name</label><input id="np-name" name="client_name" /></div>
                <div class="field"><label for="np-email">Client email</label><input id="np-email" name="client_email" type="email" /></div>
              </div>
              <div class="field"><label for="np-summary">Summary <span class="opt">(the client sees this)</span></label><textarea id="np-summary" name="summary" style="min-height:80px"></textarea></div>
              <div class="form-row">
                <div class="field"><label for="np-due">Target date</label><input id="np-due" name="due_date" type="date" /></div>
                <div class="field"><label for="np-quote">From quote <span class="opt">(optional)</span></label><input id="np-quote" name="quote_number" class="mono" placeholder="QT-2026-0001" /></div>
              </div>
              <button class="btn btn-ink btn-full" type="submit">Create project</button>
              <div class="admin-note" id="npDone" hidden></div>
            </form>
            <div id="projectList" class="admin-list"></div>
          </div>
        </div>

        <div class="tab" data-pane="quotes" hidden><div id="quoteList" class="admin-list"></div></div>
        <div class="tab" data-pane="invoices" hidden><div id="invoiceList" class="admin-list"></div></div>
        <div class="tab" data-pane="payments" hidden><div id="paymentList" class="admin-list"></div></div>
      </section>

    </div>
  </main>

  <template id="updateTpl">
    <form class="form update-form" novalidate>
      <div class="field"><label>Update title</label><input name="title" placeholder="Homepage design ready for review" /></div>
      <div class="field"><label>Details <span class="opt">(optional)</span></label><textarea name="body" style="min-height:70px"></textarea></div>
      <div class="form-row">
        <div class="field"><label>Stage</label><select name="stage"></select></div>
        <div class="field"><label>Progress <output class="mono" name="pctOut"></output></label><input name="progress" type="range" min="0" max="100" step="5" /></div>
      </div>
      <div class="field"><label>Link <span class="opt">(staging URL, optional)</span></label><input name="link" type="url" placeholder="https://" /></div>
      <button class="btn btn-green btn-sm" type="submit">Post update</button>
    </form>
  </template>

  <script src="/script.js"></script>
  <script>
  (() => {
    const STAGES = { discovery: 'Discovery', design: 'Design', build: 'Build', testing: 'Testing', launch: 'Launch', done: 'Complete' };
    const A = (path, opts = {}) => api(path, { ...opts, admin: true });
    const setKey = (k) => k ? localStorage.setItem('deon.adminKey', k) : localStorage.removeItem('deon.adminKey');
    const trackLink = (code) => `${location.origin}/track?code=${encodeURIComponent(code)}`;
    const empty = (what) => `<p class="muted admin-empty">No ${what} yet.</p>`;
    wakeApi();

    /* ── Gate ── */
    const open = async () => {
      try { await A('/api/admin/check'); }
      catch (e) {
        $('#gate').hidden = false; $('#dash').hidden = true;
        if (localStorage.getItem('deon.adminKey')) { $('#gateMsg').textContent = e.status === 401 ? 'Wrong admin key.' : e.message; $('#gateMsg').hidden = false; }
        return;
      }
      $('#gate').hidden = true; $('#dash').hidden = false;
      loadProjects();
    };
    $('#gateForm').addEventListener('submit', (e) => { e.preventDefault(); setKey($('#a-key').value.trim()); open(); });
    $('#lockBtn').addEventListener('click', () => { setKey(''); location.reload(); });

    /* ── Tabs ── */
    const loaders = { projects: () => loadProjects(), quotes: () => loadQuotes(), invoices: () => loadInvoices(), payments: () => loadPayments() };
    $$('.admin-tabs button').forEach((b) => b.addEventListener('click', () => {
      $$('.admin-tabs button').forEach((x) => x.classList.toggle('on', x === b));
      $$('.tab').forEach((t) => t.hidden = t.dataset.pane !== b.dataset.tab);
      loaders[b.dataset.tab]();
    }));

    /* ── Projects ── */
    const projectCard = (p) => `
      <article class="admin-card" data-code="${esc(p.code)}">
        <header>
          <div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.client_name)} · ${esc(p.client_email)}</p></div>
          <div class="admin-card-meta"><span class="mono">${esc(p.code)}</span><strong>${p.progress}%</strong><span class="muted">${STAGES[p.stage] || p.stage}</span></div>
        </header>
        <div class="meter-bar"><i style="width:${p.progress}%"></i></div>
        <div class="admin-actions">
          <button type="button" class="text-link" data-act="update">Post update</button>
          <button type="button" class="text-link" data-act="copy">Copy tracking link</button>
          <a class="text-link" href="/invoice">Invoice</a>
        </div>
        <div class="update-slot"></div>
        <ol class="admin-updates">${p.updates.slice(0, 4).map((u) => `<li><span class="muted">${fmtDate(u.created_at)}</span> ${esc(u.title)} <span class="mono muted">${u.progress}%</span></li>`).join('')}</ol>
      </article>`;

    const loadProjects = async () => {
      const list = await A('/api/admin/projects').catch((e) => (toast(e.message), []));
      $('#projectList').innerHTML = list.length ? list.map(projectCard).join('') : empty('projects');
    };

    $('#projectList').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const card = btn.closest('.admin-card'), code = card.dataset.code;
      if (btn.dataset.act === 'copy') {
        const text = `Track your project at ${trackLink(code)} using code ${code} and your email.`;
        try { await navigator.clipboard.writeText(text); toast('Tracking message copied'); } catch { toast(text); }
        return;
      }
      const slot = $('.update-slot', card);
      if (slot.firstChild) { slot.innerHTML = ''; return; }
      const form = $('#updateTpl').content.firstElementChild.cloneNode(true);
      form.stage.innerHTML = Object.entries(STAGES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
      const cur = card.querySelector('.admin-card-meta');
      const stageKey = Object.keys(STAGES).find((k) => STAGES[k] === cur.children[2].textContent) || 'build';
      form.stage.value = stageKey;
      form.progress.value = parseInt(cur.children[1].textContent, 10) || 0;
      const sync = () => form.pctOut.value = form.progress.value + '%';
      form.progress.addEventListener('input', sync); sync();
      form.stage.addEventListener('change', () => { if (form.stage.value === 'done') { form.progress.value = 100; sync(); } });
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (!form.title.value.trim()) return form.title.closest('.field').classList.add('invalid');
        try {
          await A(`/api/admin/projects/${encodeURIComponent(code)}/updates`, { method: 'POST', body: {
            title: form.title.value.trim(), body: form.body.value.trim(), stage: form.stage.value,
            progress: Number(form.progress.value), link: form.link.value.trim(),
          } });
          toast('Update posted');
          loadProjects();
        } catch (err) { toast(err.message); }
      });
      slot.append(form);
      form.title.focus();
    });

    const np = $('#newProject');
    np.addEventListener('submit', async (e) => {
      e.preventDefault();
      const need = ['title', 'client_name', 'client_email'];
      let ok = true;
      need.forEach((n) => { const bad = !np[n].value.trim() || (n === 'client_email' && !np[n].checkValidity()); np[n].closest('.field').classList.toggle('invalid', bad); ok = ok && !bad; });
      if (!ok) return;
      try {
        const p = await A('/api/admin/projects', { method: 'POST', body: {
          title: np.title.value.trim(), client_name: np.client_name.value.trim(), client_email: np.client_email.value.trim(),
          summary: np.summary.value.trim(), due_date: np.due_date.value || null, quote_number: np.quote_number.value.trim() || null,
        } });
        np.reset();
        $('#npDone').hidden = false;
        $('#npDone').innerHTML = `Created <strong class="mono">${esc(p.code)}</strong>. Send the client: <span class="mono">${esc(trackLink(p.code))}</span>`;
        loadProjects();
      } catch (err) { toast(err.message); }
    });

    /* ── Quotes ── */
    const QSTATUS = ['new', 'quoted', 'won', 'lost'];
    const loadQuotes = async () => {
      const list = await A('/api/admin/quotes').catch((e) => (toast(e.message), []));
      $('#quoteList').innerHTML = list.length ? list.map((q) => `
        <article class="admin-card" data-number="${esc(q.number)}">
          <header>
            <div><h3>${esc(q.name)}${q.company ? ' · ' + esc(q.company) : ''}</h3>
              <p class="muted"><a href="mailto:${esc(q.email)}">${esc(q.email)}</a>${q.phone ? ' · ' + esc(q.phone) : ''}</p></div>
            <div class="admin-card-meta"><span class="mono">${esc(q.number)}</span><span class="muted">${fmtDate(q.created_at)}</span>
              <select data-act="status" aria-label="Status">${QSTATUS.map((s) => `<option${s === q.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
          </header>
          <p><strong>${esc(q.services.map((id) => SERVICES.find((s) => s.id === id)?.name || id).join(', '))}</strong>${q.extras.length ? ' + ' + esc(q.extras.join(', ')) : ''} · <span class="muted">${esc(q.timeline)}</span></p>
          ${q.brief ? `<p class="muted admin-brief">${esc(q.brief).replace(/\n/g, '<br>')}</p>` : ''}
          <div class="admin-actions"><button type="button" class="text-link" data-act="start" data-name="${esc(q.name)}" data-email="${esc(q.email)}" data-company="${esc(q.company)}">Start project from this</button></div>
        </article>`).join('') : empty('quote requests');
    };
    $('#quoteList').addEventListener('change', async (e) => {
      if (e.target.dataset.act !== 'status') return;
      const n = e.target.closest('.admin-card').dataset.number;
      try { await A(`/api/admin/quotes/${encodeURIComponent(n)}`, { method: 'PATCH', body: { status: e.target.value } }); toast('Saved'); }
      catch (err) { toast(err.message); }
    });
    $('#quoteList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act=start]');
      if (!b) return;
      np.client_name.value = b.dataset.name; np.client_email.value = b.dataset.email;
      np.title.value = (b.dataset.company || b.dataset.name) + ' project';
      np.quote_number.value = b.closest('.admin-card').dataset.number;
      $('.admin-tabs [data-tab=projects]').click();
      np.title.focus();
    });

    /* ── Invoices & payments ── */
    const loadInvoices = async () => {
      const list = await A('/api/admin/invoices').catch((e) => (toast(e.message), []));
      $('#invoiceList').innerHTML = list.length ? `<div class="admin-table">` + list.map((i) => `
        <div><span class="mono">${esc(i.number)}</span><span>${esc(i.client_name)}${i.project_code ? ` <span class="mono muted">${esc(i.project_code)}</span>` : ''}</span>
        <span>${kes(i.total)}</span><span class="inv-status ${i.balance ? '' : 'paid'}">${i.balance ? kes(i.balance) + ' due' : 'Paid'}</span>
        <button type="button" class="text-link" data-link="${esc(location.origin + '/pay?inv=' + encodeURIComponent(i.number))}">Copy pay link</button></div>`).join('') + '</div>' : empty('invoices');
    };
    $('#invoiceList').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-link]');
      if (!b) return;
      try { await navigator.clipboard.writeText(b.dataset.link); toast('Payment link copied'); } catch { toast(b.dataset.link); }
    });
    const loadPayments = async () => {
      const list = await A('/api/admin/payments').catch((e) => (toast(e.message), []));
      $('#paymentList').innerHTML = list.length ? `<div class="admin-table">` + list.map((p) => `
        <div><span class="muted">${fmtDateTime(p.created_at)}</span><span>${esc(p.name)}<br><span class="muted">${esc(p.description)}</span></span>
        <span>${kes(p.amount)}</span><span class="inv-status ${p.status === 'success' ? 'paid' : ''}">${p.status === 'success' ? 'Paid' : p.status === 'failed' ? 'Failed' : 'Pending'}</span>
        <span class="mono">${esc(p.mpesa_code || p.receipt_number || '')}</span></div>`).join('') + '</div>' : empty('payments');
    };

    if (localStorage.getItem('deon.adminKey')) open();
  })();
  </script>
</body>
</html>
