# Render Blueprint for the API. The database lives on Supabase (set DATABASE_URL).
services:
  - type: web
    name: deon-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Supabase > Project Settings > Database > Connection string > "Session pooler" (port 5432).
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: PAYHERO_CALLBACK_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        value: https://deon-api.onrender.com
      - key: CORS_ORIGINS
        value: https://deon.ardena.co.ke
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      # Resend: API key, plus a sender on a domain you've verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Deon Orina <hello@deon.ardena.co.ke>"
      - key: EMAIL_REPLY_TO
        value: ceo@ardena.co.ke
      - key: NOTIFY_EMAIL
        value: ceo@ardena.co.ke
      - key: SITE_URL
        value: https://deon.ardena.co.ke

