# Render Blueprint: New > Blueprint > pick this repo. Creates the API and its Postgres database.
services:
  - type: web
    name: deon-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: deon-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: PAYHERO_CALLBACK_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        value: https://deon-api.onrender.com
      - key: CORS_ORIGINS
        value: https://deon.ardena.co.ke
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false

databases:
  - name: deon-db
    plan: free
    region: frankfurt
    databaseName: deon
    user: deon
