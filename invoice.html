<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice | Deon Orina</title>
  <meta name="description" content="Create an invoice." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="author" content="Deon Orina" />
  <meta name="theme-color" content="#0B6B53" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="adm-body">

  <!-- Locked -->
  <section class="adm-gate" id="gate" hidden>
    <form class="adm-gate-card form" id="gateForm" novalidate>
      <a href="/" class="nav-logo">deon<span>.</span></a>
      <h1>Invoice builder</h1>
      <p class="muted">Enter your admin key, or the access key Deon gave you. It's kept in this browser only.</p>
      <div class="field"><label for="a-key">Key</label><input id="a-key" type="password" autocomplete="current-password" required /></div>
      <p class="field-hint" id="gateMsg" hidden style="color:var(--red)"></p>
      <button class="btn btn-ink btn-full" type="submit">Open</button>
    </form>
  </section>

  <div class="adm" id="app" hidden>
    <aside class="adm-side no-print" id="admSide"></aside>

    <main class="adm-main">
      <header class="adm-head no-print">
        <div><p class="muted">Line items, VAT and notes. Save it to email the client a payment link, or print it as a PDF.</p><h1>Invoice builder</h1></div>
        <a class="btn btn-sm btn-outline" href="/admin#money">Pending amounts</a>
      </header>
      <div class="split" style="grid-template-columns:minmax(0,5fr) minmax(0,7fr)">
        <form class="adm-box form no-print" id="invForm" novalidate>
          <div class="field"><label for="i-project">Project <span class="opt">(optional)</span></label><select id="i-project" name="project"><option value="">No project</option></select></div>
          <div class="form-row">
            <div class="field"><label for="i-number">Invoice no.</label><input id="i-number" name="number" class="mono" placeholder="Auto" /></div>
            <div class="field"><label for="i-due">Due in</label>
              <select id="i-due" name="due">
                <option value="0">On receipt</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="field"><label for="i-name">Client name</label><input id="i-name" name="clientName" placeholder="Jane Wanjiku" /></div>
            <div class="field"><label for="i-company">Company</label><input id="i-company" name="clientCompany" placeholder="Acme Ltd" /></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="i-email">Email</label><input id="i-email" name="clientEmail" type="email" placeholder="jane@acme.co.ke" /></div>
            <div class="field"><label for="i-phone">Phone</label><input id="i-phone" name="clientPhone" type="tel" placeholder="0712 345 678" /></div>
          </div>

          <div>
            <div class="item-head legend"><span>Item</span><span>Qty</span><span>Rate</span><span></span></div>
            <div class="items" id="items"></div>
            <button type="button" class="add-line" id="addLine"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Add line</button>
          </div>

          <label class="toggle"><input type="checkbox" name="vat" /> Add VAT (16%)</label>
          <label class="toggle"><input type="checkbox" name="sendEmail" checked /> Email the invoice to the client</label>

          <div class="field"><label for="i-notes">Notes</label><textarea id="i-notes" name="notes" style="min-height:80px">50% deposit to start, balance on delivery. Thank you for your business.</textarea></div>

          <div style="display:grid;gap:12px">
            <button type="button" class="btn btn-ink btn-full" id="saveBtn">Save &amp; copy payment link</button>
            <button type="button" class="btn btn-outline btn-full" id="printBtn">Print / save PDF</button>
          </div>
        </form>

        <div class="sticky inv-sticky">
          <article class="doc" id="doc" aria-label="Invoice preview"></article>
        </div>
      </div>
    </main>
  </div>

  <script src="/script.js"></script>
  <script src="/admin-ui.js"></script>
  <script>
  (() => {
    const form = $('#invForm');
    const itemsEl = $('#items');
    const loadNumber = () => api('/api/admin/invoices/next-number', { admin: true })
      .then((r) => { if (!form.number.value) { form.number.placeholder = r.number; render(); } })
      .catch(() => {});
    let projects = [];
    /* Picking a project fills in the client. */
    form.project.addEventListener('change', () => {
      const p = projects.find((x) => x.code === form.project.value);
      if (p) { form.clientName.value = p.client_name; form.clientEmail.value = p.client_email; render(); }
    });

    const addLine = (desc = '', qty = 1, rate = '') => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="field"><input aria-label="Item" data-k="desc" placeholder="Website design &amp; build" value="${esc(desc)}" /></div>
        <div class="field"><input aria-label="Quantity" data-k="qty" type="number" min="0" step="1" value="${qty}" /></div>
        <div class="field"><input aria-label="Rate in KES" data-k="rate" type="number" min="0" step="1" placeholder="0" value="${rate}" /></div>
        <button type="button" class="icon-btn" aria-label="Remove line"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
      row.querySelector('.icon-btn').addEventListener('click', () => {
        if (itemsEl.children.length > 1) row.remove();
        render();
      });
      itemsEl.append(row);
    };

    const read = () => {
      const items = $$('.item-row', itemsEl).map((r) => ({
        desc: $('[data-k=desc]', r).value.trim(),
        qty: Number($('[data-k=qty]', r).value) || 0,
        rate: Number($('[data-k=rate]', r).value) || 0,
      })).filter((i) => i.desc || i.rate);
      const subtotal = items.reduce((a, i) => a + i.qty * i.rate, 0);
      const vat = form.vat.checked ? Math.round(subtotal * 0.16) : 0;
      const issued = Date.now();
      return {
        number: (form.number.value.trim() || form.number.placeholder).toUpperCase(),
        issued, due: issued + Number(form.due.value) * 864e5, dueDays: Number(form.due.value),
        client: { name: form.clientName.value.trim(), company: form.clientCompany.value.trim(), email: form.clientEmail.value.trim(), phone: form.clientPhone.value.trim() },
        items, subtotal, vat, total: subtotal + vat, notes: form.notes.value.trim(),
      };
    };

    const render = () => {
      const inv = read();
      const c = inv.client;
      $('#doc').innerHTML = `
        <header class="doc-head">
          <div class="doc-brand">
            <span class="nav-logo">deon<span>.</span></span>
            <p>${BUSINESS.title}<br>${BUSINESS.email} · ${BUSINESS.phone}<br>${BUSINESS.location}${BUSINESS.pin ? ' · PIN ' + BUSINESS.pin : ''}</p>
          </div>
          <div class="doc-kind"><h2>Invoice</h2><p class="mono">${esc(inv.number)}</p></div>
        </header>
        <div class="doc-meta">
          <div><span class="type-label">Billed to</span><p>${esc(c.name) || '<span class="muted">Client name</span>'}${c.company ? '<br>' + esc(c.company) : ''}${c.email ? '<br>' + esc(c.email) : ''}${c.phone ? '<br>' + esc(c.phone) : ''}</p></div>
          <div><span class="type-label">Issued</span><p>${fmtDate(inv.issued)}</p></div>
          <div><span class="type-label">Due</span><p>${inv.dueDays ? fmtDate(inv.due) : 'On receipt'}</p></div>
        </div>
        <table class="doc-table">
          <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
          <tbody>${inv.items.length ? inv.items.map((i) => `<tr><td>${esc(i.desc)}</td><td>${i.qty}</td><td>${kes(i.rate)}</td><td>${kes(i.qty * i.rate)}</td></tr>`).join('')
            : '<tr><td colspan="4" class="muted">Add a line item</td></tr>'}</tbody>
        </table>
        <div class="doc-totals">
          <div><span>Subtotal</span><span>${kes(inv.subtotal)}</span></div>
          ${inv.vat ? `<div><span>VAT 16%</span><span>${kes(inv.vat)}</span></div>` : ''}
          <div class="grand"><span>Total due</span><span>${kes(inv.total)}</span></div>
        </div>
        <footer class="doc-foot">
          <p>${esc(inv.notes).replace(/\n/g, '<br>')}</p>
          <p style="text-align:right">Pay online with M-Pesa<br><strong style="color:var(--ink)">${location.host || 'deon.dev'}/pay</strong> · ref <span class="mono">${esc(inv.number)}</span></p>
        </footer>`;
      return inv;
    };

    addLine();
    form.addEventListener('input', render);
    form.addEventListener('change', render);
    $('#addLine').addEventListener('click', () => { addLine(); render(); $$('[data-k=desc]', itemsEl).pop().focus(); });
    render();
    Admin.start().then(async () => {
      Admin.sidebar('invoice');
      if (!Admin.can('money')) { $('.split').innerHTML = '<p class="muted">You do not have access to invoices. Ask Deon to add Pending amounts to your access.</p>'; return; }
      loadNumber();
      projects = await api('/api/admin/projects', { admin: true }).catch(() => []);
      form.project.innerHTML = '<option value="">No project</option>' + projects.filter((p) => p.code !== 'DO-DEMO01' && p.status !== 'completed')
        .map((p) => `<option value="${esc(p.code)}">${esc(p.title)} · ${esc(p.client_name)}</option>`).join('');
      const pre = params().project;
      if (pre) { form.project.value = pre.toUpperCase(); form.project.dispatchEvent(new Event('change')); }
    });

    $('#printBtn').addEventListener('click', () => print());

    $('#saveBtn').addEventListener('click', async () => {
      const inv = read();
      if (!inv.client.name) { form.clientName.closest('.field').classList.add('invalid'); return form.clientName.focus(); }
      if (!inv.total) return toast('Add at least one line item with a rate');
      form.clientName.closest('.field').classList.remove('invalid');

      const btn = $('#saveBtn');
      btn.disabled = true;
      try {
        const saved = await api('/api/admin/invoices', { method: 'POST', admin: true, body: {
          number: form.number.value.trim() || null,
          project_code: form.project.value || null,
          client_name: inv.client.name, client_company: inv.client.company,
          client_email: inv.client.email, client_phone: inv.client.phone,
          items: inv.items.filter((i) => i.desc && i.qty > 0), vat: form.vat.checked,
          notes: inv.notes, due_days: inv.dueDays, send_email: form.sendEmail.checked,
        } });
        form.number.value = saved.number;
        render();
        const link = location.origin + '/pay?inv=' + encodeURIComponent(saved.number);
        const mailed = form.sendEmail.checked && saved.client_email ? ' and emailed' : '';
        try { await navigator.clipboard.writeText(link); toast(`Saved${mailed}. Payment link copied`); }
        catch { toast('Saved. Link: ' + link); }
      } catch (err) {
        toast(err.message);
      } finally { btn.disabled = false; }
    });
  })();
  </script>
</body>
</html>
