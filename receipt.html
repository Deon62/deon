<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt | Deon Orina</title>
  <meta name="description" content="View your payment receipt." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="author" content="Deon Orina" />
  <meta name="theme-color" content="#0B6B53" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/favicon-96.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="nav-wrapper" id="nav">
    <nav class="nav" aria-label="Main">
      <a href="/" class="nav-logo" aria-label="Deon Orina, home">deon<span>.</span></a>
      <div class="nav-center">
        <a href="/">Home</a>
        <a href="/services">Services</a>
        <a href="/about">About</a>
        <a href="/quote">Get a quote</a>
        <a href="/pay">Pay</a>
        <a href="/track">Track</a>
      </div>
      <div class="nav-right">
        <a href="/quote" class="btn btn-sm">Start a project</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navDrawer"><span></span><span></span><span></span></button>
    </nav>
  </header>
  <div class="nav-drawer" id="navDrawer">
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/about">About</a>
    <a href="/quote">Get a quote</a>
    <a href="/pay">Pay</a>
    <a href="/track">Track</a>
    <a href="/quote" class="btn">Start a project</a>
  </div>

  <main class="page">
    <div class="wrap receipt-wrap">

      <!-- Lookup, shown when no receipt is given -->
      <section id="lookup" hidden>
        <div class="page-head">
          <h1 class="type-statement hero-anim" style="animation-delay:.08s">Find a receipt.</h1>
          <p class="type-lede muted hero-anim" style="animation-delay:.16s">Enter your receipt number and the M-Pesa code from your confirmation SMS.</p>
        </div>
        <form class="panel form hero-anim" id="lookupForm" style="animation-delay:.24s" novalidate>
          <div class="field"><label for="r-id">Receipt number</label><input id="r-id" name="id" class="mono" placeholder="RCT-2026-0001" required /></div>
          <div class="field"><label for="r-code">M-Pesa code</label><input id="r-code" name="code" class="mono" placeholder="SKL4Q8XZ2P" autocomplete="off" required /></div>
          <p class="field-hint" id="lookupMsg" hidden style="color:var(--red)">No receipt matches that number and M-Pesa code.</p>
          <button class="btn btn-ink btn-full" type="submit">Show receipt</button>
        </form>
      </section>

      <!-- Receipt -->
      <section id="receiptView" hidden>
        <article class="doc hero-anim" id="doc" aria-label="Receipt"></article>
        <div class="doc-actions no-print">
          <button class="btn btn-ink" type="button" onclick="print()">Download PDF</button>
          <a class="btn btn-outline" href="/">Done</a>
        </div>
      </section>

    </div>
  </main>

  <script src="/script.js"></script>
  <script>
  (() => {
    const show = (r) => {
      $('#lookup').hidden = true;
      $('#receiptView').hidden = false;
      document.title = `Receipt ${r.number} | Deon`;
      $('#doc').innerHTML = `
        <header class="doc-head">
          <div class="doc-brand">
            <span class="nav-logo">deon<span>.</span></span>
            <p>${BUSINESS.title}<br>${BUSINESS.email} · ${BUSINESS.phone}<br>${BUSINESS.location}${BUSINESS.pin ? ' · PIN ' + BUSINESS.pin : ''}</p>
          </div>
          <div class="doc-kind"><h2>Receipt</h2><p class="mono">${esc(r.number)}</p></div>
        </header>
        <div class="doc-meta">
          <div><span class="type-label">Received from</span><p>${esc(r.name)}${r.email ? '<br>' + esc(r.email) : ''}${r.phone ? '<br>+' + esc(r.phone) : ''}</p></div>
          <div><span class="type-label">Paid on</span><p>${fmtDateTime(r.paid_at)}</p></div>
          <div><span class="type-label">Method</span><p>${esc(r.method || 'M-Pesa')}<br><span class="mono">${esc(r.mpesa_code)}</span></p></div>
        </div>
        <table class="doc-table">
          <thead><tr><th>Description</th><th>Amount</th></tr></thead>
          <tbody><tr><td>${esc(r.description)}${r.invoice ? `<br><span class="muted">Against invoice <span class="mono">${esc(r.invoice)}</span></span>` : ''}</td><td>${kes(r.amount)}</td></tr></tbody>
        </table>
        <div class="doc-totals">
          <div class="grand"><span>Amount paid</span><span>${kes(r.amount)}</span></div>
        </div>
        <footer class="doc-foot">
          <p>Thank you for your payment.<br>Keep this receipt for your records.</p>
          <span class="doc-stamp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Paid</span>
        </footer>`;
    };

    const DEMO = {
      number: 'RCT-2026-0000', name: 'Jane Wanjiku', email: 'jane@acme.co.ke', phone: '254712345678',
      amount: 60000, description: 'Invoice INV-2026-0001 (50% deposit)', invoice: 'INV-2026-0001',
      mpesa_code: 'SKL4Q8XZ2P', paid_at: new Date().toISOString(),
    };
    const openLookup = (msg) => {
      $('#lookup').hidden = false;
      $('#lookupMsg').hidden = !msg;
      if (msg) $('#lookupMsg').textContent = msg;
    };

    const { id, demo } = params();
    if (demo) return show(DEMO);
    if (id) {
      api('/api/receipts/' + encodeURIComponent(id)).then(show).catch((e) => openLookup(e.status === 404 ? 'That receipt link is not valid. Look it up below.' : e.message));
    } else openLookup();

    $('#lookupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const number = $('#r-id').value.trim(), code = $('#r-code').value.trim();
      if (!number || !code) return openLookup('Enter both the receipt number and the M-Pesa code.');
      const btn = e.submitter; if (btn) btn.disabled = true;
      try {
        const { token } = await api('/api/receipts/lookup', { method: 'POST', body: { number, mpesa_code: code } });
        const r = await api('/api/receipts/' + encodeURIComponent(token));
        history.replaceState(null, '', '?id=' + encodeURIComponent(token));
        show(r);
      } catch (err) {
        openLookup(err.status === 404 ? 'No receipt matches that number and M-Pesa code.' : err.message);
      } finally { if (btn) btn.disabled = false; }
    });
  })();
  </script>
</body>
</html>
